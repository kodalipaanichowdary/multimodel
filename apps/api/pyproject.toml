[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pos-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7,<3",
  "pyyaml>=6",
  # P2: HTTP client for the Ollama gateway and the fetch/search tools
  "httpx>=0.27,<1",
  # P2: orchestration graph (wrapped by app.agent_runtime.workflow; never imported elsewhere)
  "langgraph>=0.6,<0.7",
  # P2: tool fabric (MCP servers in mcp/, in-process client sessions)
  "mcp>=1.2,<2",
  # P3: OpenTelemetry SDK for per-task traces (local file exporter only; no OTLP/network exporter)
  "opentelemetry-sdk>=1.25,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests", "../../packages/schemas/python/tests"]
asyncio_mode = "auto"
